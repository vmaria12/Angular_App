<div class="page-container">
    <mat-card class="data-card">

        <mat-card-header>
            <mat-card-title style="color: #fff;">
                <mat-icon>menu_book</mat-icon>
                Lista tuturor cursurilor disponibile
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <p *ngIf="courses.length === 0" class="empty-msg">
                <mat-icon>hourglass_empty</mat-icon>
                Se încarcă cursurile...
            </p>

            <div *ngFor="let course of courses; let i = index" class="data-row">
                <span class="row-index">#{{ i + 1 }}</span>
                <span class="row-label">{{ course.title }}</span>
                <span class="row-value">{{ course.description }}</span>
            </div>

        </mat-card-content>

    </mat-card>
</div>
